<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK One</title>
<link rel="icon" type="image/png" href="mkone2.png">

<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0f14;
  --card:#111826;
  --border:rgba(255,255,255,0.10);
  --text:rgba(255,255,255,0.92);
  --muted:rgba(255,255,255,0.65);
  --input-bg:rgba(255,255,255,0.06);
  --shadow:0 18px 50px rgba(0,0,0,0.45);
  --focus:rgba(0,194,106,0.35);
  --accent:#00c26a;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:18px;
  font-family:'Google Sans',sans-serif;
  background:
    radial-gradient(1200px 700px at 20% 0%, rgba(0,194,106,0.10), transparent 55%),
    radial-gradient(900px 600px at 80% 10%, rgba(120,120,255,0.10), transparent 55%),
    var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

.container{
  position:relative;
  width:min(620px,100%);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.06), transparent 50%),
    var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:18px;
  overflow:hidden;
}

/* Top bar */
.topbar{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
}

.hamburger{
  width:38px;
  height:38px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--input-bg);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition:background 150ms ease;
}
.hamburger:hover{background:rgba(255,255,255,0.10)}
.hamburger svg{width:18px;height:18px}

h2{
  margin:0;
  font-family:'Fraunces', serif;
  font-size:22px;
  font-weight:600;
}

.brand-link{
  display:inline-block;
  text-decoration:none;
  -webkit-user-select:none;
  -moz-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  outline:none;
  cursor:pointer;
}

.brand-title{
  margin:0;
  font-family:'Fraunces', serif;
  font-size:26px;
  font-weight:600;
  color:beige;
  letter-spacing:0.2px;
}

/* Search - pill shaped, Google style */
.search{margin-bottom:20px}

.search-wrap{
  position:relative;
  display:flex;
  align-items:center;
  width:100%;
  background:var(--input-bg);
  border:1px solid var(--border);
  border-radius:999px;
  padding:0 16px;
  transition:border-color 150ms ease, box-shadow 150ms ease;
}

.search-wrap:focus-within{
  border-color:rgba(0,194,106,0.6);
  box-shadow:0 0 0 4px var(--focus);
}

.search-wrap svg{
  width:18px;
  height:18px;
  flex-shrink:0;
  color:var(--muted);
}

.search-wrap input{
  flex:1;
  width:100%;
  padding:12px 10px;
  font-size:15px;
  font-weight:500;
  background:transparent;
  color:var(--text);
  border:none;
  outline:none;
  font-family:inherit;
}

.search-wrap input::placeholder{color:var(--muted)}

/* App grid */
.app-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px 18px;
}

.app{text-align:center; display:block}

.icon-tile{
  width:68px;
  height:68px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto;
  color:var(--accent);
  transition:transform 180ms ease, color 180ms ease;
}
.icon-tile svg,.icon-tile-sm svg,.picker-icon svg{width:100%;height:100%;display:block;overflow:visible}
.icon-tile svg{width:78%;height:78%}
.icon-tile-sm svg,.picker-icon svg{width:100%;height:100%}

.icon-tile:hover{
  transform:scale(1.08);
  color:#3ee594;
}

.app-label{
  margin-top:8px;
  font-size:13px;
  font-weight:600;
  line-height:1.25;
  color:var(--text);
}

a{text-decoration:none;color:inherit}

.empty-msg{
  grid-column:1/-1;
  text-align:center;
  color:var(--muted);
  font-size:14px;
  padding:20px 0;
}

/* Mobile */
@media(max-width:520px){
  .app-grid{grid-template-columns:repeat(3,1fr); gap:22px 10px}
  .icon-tile{width:58px; height:58px; border-radius:14px}
  .app-label{font-size:12px}
}

/* Row-limited scrolling (applied dynamically via inline max-height) */
.app-grid{
  overflow-y:hidden;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,0.25) transparent;
}
.app-grid::-webkit-scrollbar{width:6px}
.app-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.25); border-radius:3px}
.app-grid::-webkit-scrollbar-track{background:transparent}

/* ===== Sidebar ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  opacity:0;
  pointer-events:none;
  transition:opacity 220ms ease;
  z-index:40;
}
.overlay.open{opacity:1; pointer-events:auto}

.sidebar{
  position:fixed;
  top:0;
  left:0;
  height:100%;
  width:280px;
  background:var(--card);
  border-right:1px solid var(--border);
  transform:translateX(-100%);
  transition:transform 240ms ease;
  z-index:50;
  padding:18px;
  display:flex;
  flex-direction:column;
}
.sidebar.open{transform:translateX(0)}

@media(max-width:520px){
  .sidebar{width:85vw; max-width:300px}
}

.sidebar-view{
  display:flex;
  flex-direction:column;
  height:100%;
  min-height:0;
}

.sidebar-title{
  font-size:16px;
  font-weight:700;
  margin-bottom:18px;
  color:var(--text);
}

.sidebar-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  color:var(--text);
  transition:background 150ms ease;
}
.sidebar-item:hover{background:rgba(255,255,255,0.08)}
.sidebar-item svg{width:18px;height:18px;color:var(--muted)}

/* ===== Archive (inside sidebar, left side) ===== */
.sidebar-archive-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
  flex-shrink:0;
}
.sidebar-archive-header .sidebar-title{margin:0; flex:1}

.icon-btn{
  width:34px;
  height:34px;
  border-radius:9px;
  border:1px solid var(--border);
  background:var(--input-bg);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition:background 150ms ease;
}
.icon-btn:hover{background:rgba(255,255,255,0.10)}
.icon-btn svg{width:16px;height:16px}

.archive-list{
  display:flex;
  flex-direction:column;
  gap:2px;
  overflow-y:auto;
  flex:1;
  min-height:0;
  margin:0 -8px;
}

.archive-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  border-radius:10px;
  position:relative;
  transition:background 150ms ease;
}
.archive-row:hover,
.archive-row.show-dots{background:rgba(255,255,255,0.06)}

.icon-tile-sm{
  width:38px;
  height:38px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--accent);
  flex-shrink:0;
}

.archive-row-name{
  flex:1;
  font-size:13.5px;
  font-weight:600;
  color:var(--text);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  min-width:0;
}

.archive-dots{
  width:26px;
  height:26px;
  border-radius:50%;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  z-index:2;
  opacity:0;
  transform:scale(1);
  transition:opacity 150ms ease, transform 150ms ease, background 150ms ease;
}
.archive-row:hover .archive-dots,
.archive-row.show-dots .archive-dots{opacity:1}

/* Hover directly on the 3 dots: shrink dot + its circle, no fading */
.archive-dots:hover{
  transform:scale(0.82);
  background:rgba(255,255,255,0.16);
}
.archive-dots svg{width:13px;height:13px}

.empty-archive{
  color:var(--muted);
  font-size:13px;
  padding:16px 8px;
  text-align:center;
}

/* Options popover — always rendered sideways of the row it belongs to,
   positioned with JS (fixed) so it is never clipped by any scroll container */
.archive-popover{
  position:fixed;
  min-width:120px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:6px;
  display:none;
  flex-direction:column;
  z-index:80;
  text-align:left;
}
.archive-popover.open{display:flex}

.archive-popover button{
  background:transparent;
  border:none;
  color:var(--text);
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  padding:8px 10px;
  border-radius:8px;
  cursor:pointer;
  text-align:left;
}
.archive-popover button:hover{background:rgba(255,255,255,0.08)}
.archive-popover button.danger{color:#e0685f}

/* ===== Picker modal ===== */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:60;
}
.modal-overlay.open{display:flex}

.modal{
  width:min(620px,100%);
  max-height:70vh;
  overflow-y:auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px 18px 0 0;
  padding:18px;
}

.modal-title{
  font-size:16px;
  font-weight:700;
  margin-bottom:14px;
}

.picker-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 6px;
  border-radius:10px;
  cursor:pointer;
}
.picker-row:hover{background:rgba(255,255,255,0.06)}

.picker-icon{
  width:38px;
  height:38px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--accent);
  flex-shrink:0;
}

.picker-name{font-size:14px; font-weight:600; flex:1}

.picker-check{
  width:20px;
  height:20px;
  border-radius:6px;
  border:1.5px solid var(--border);
  flex-shrink:0;
}
.picker-row.selected .picker-check{
  background:var(--accent);
  border-color:var(--accent);
}

.modal-done{
  width:100%;
  margin-top:14px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:#06130c;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container" id="container">
  <div class="topbar">
    <div class="hamburger" id="hamburgerBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </div>
    <a class="brand-link" id="brandLink" href="https://kariyala.github.io/mkone/" draggable="false">
      <h2 class="brand-title">MK One</h2>
    </a>
  </div>

  <div class="search">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Search apps…" oninput="renderMain()">
    </div>
  </div>

  <div class="app-grid" id="mainGrid"></div>
</div>

<!-- Sidebar -->
<div class="overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">

  <!-- Menu view -->
  <div class="sidebar-view" id="sidebarMenuView">
    <div class="sidebar-title">Menu</div>
    <div class="sidebar-item" id="archiveNavBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
      Archive
    </div>
  </div>

  <!-- Archive view (stays inside the left sidebar) -->
  <div class="sidebar-view" id="sidebarArchiveView" style="display:none">
    <div class="sidebar-archive-header">
      <div class="icon-btn" id="archiveBackBtn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </div>
      <div class="sidebar-title">Archive</div>
      <div class="icon-btn" id="archiveAddBtn" aria-label="Add to archive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
    </div>
    <div class="archive-list" id="archiveList"></div>
  </div>

</div>

<!-- Options popover for an archived app (Open / Remove) -->
<div class="archive-popover" id="archivePopover">
  <button type="button" data-action="open">Open</button>
  <button type="button" class="danger" data-action="remove">Remove</button>
</div>

<!-- Picker modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title">Add to Archive</div>
    <div id="pickerList"></div>
    <button class="modal-done" id="modalDoneBtn">Done</button>
  </div>
</div>

<script>
const APPS = [
  { id:"details-copy",   name:"Details Copy",     url:"https://kariyala.github.io/details-copy/" },
  { id:"price-per-unit", name:"Price Per Unit",   url:"https://kariyala.github.io/price-per-unit/" },
  { id:"hst",            name:"HST",              url:"https://kariyala.github.io/hst/" },
  { id:"calculator-h",   name:"Calculator-H",     url:"https://kariyala.github.io/calculator-h/" },
  { id:"yt-timestamp",   name:"YT Timestamp",     url:"https://kariyala.github.io/yt/yttsl/" },
  { id:"yt-thumbnail",   name:"YT Thumbnail",     url:"https://kariyala.github.io/yt/ythumb/" },
  { id:"yt-embed",       name:"YT Embed",         url:"https://kariyala.github.io/yt/ytembed/" },
  { id:"currency",       name:"Currency Exchange",url:"https://kariyala.github.io/exchange-rate/" },
  { id:"astro",          name:"Astro",            url:"https://kariyala.github.io/astro/" },
  { id:"tally",          name:"Tally Counter",    url:"https://kariyala.github.io/tally-counter/" },
  { id:"debt",           name:"Debt Calculator",  url:"https://kariyala.github.io/debt-calculator/" }
];

const COLORS = ["#3b6fe0","#e0533b","#3bab6e","#a15be0","#e0a53b","#3bc0c2","#e0468f","#7a8bde","#5bb8e0","#c2913b"];
function colorFor(id){
  let sum = 0;
  for(let i=0;i<id.length;i++) sum += id.charCodeAt(i);
  return COLORS[sum % COLORS.length];
}

let archived = JSON.parse(localStorage.getItem("mk_archived") || "[]");
function saveArchived(){ localStorage.setItem("mk_archived", JSON.stringify(archived)); }


const SV = (inner, extra="") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ${extra}>${inner}</svg>`;
const CUT = 'fill="var(--card)" stroke="currentColor"';
function zodiacDots(){
  let d="";
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6 - Math.PI/2;
    d+=`<circle cx="${(12+8.1*Math.cos(a)).toFixed(2)}" cy="${(12+8.1*Math.sin(a)).toFixed(2)}" r="0.95" fill="currentColor" stroke="none"/>`;
  }
  return d;
}
const ICONS = {
  "details-copy": SV(`<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>`),
  "price-per-unit": SV(`<path d="M3 3h8.2a2 2 0 0 1 1.4.6l8 8a2 2 0 0 1 0 2.8l-6.2 6.2a2 2 0 0 1-2.8 0l-8-8A2 2 0 0 1 3 11.2z"/><circle cx="7" cy="7" r="1.1"/><path d="M15.6 12.4c0-.9-.9-1.5-2-1.5s-2 .6-2 1.4.8 1.2 2 1.5 2 .7 2 1.6-.9 1.5-2 1.5-2-.6-2-1.4M13.6 9.6v1.3M13.6 16.5v1.3" transform="rotate(45 13.6 13.7) translate(0 0)" stroke-width="1.5"/>`),
  "hst": SV(`<path d="M12 1.6l1.5 2.8 1.9-.7-.5 3 2.4-1.2-.5 2.2 1.7.8-3.4 2.9.6 1.4-3.1-.5v2h-1.2v-2l-3.1.5.6-1.4-3.4-2.9 1.7-.8-.5-2.2 2.4 1.2-.5-3 1.9.7z" fill="currentColor" stroke-width=".6" transform="translate(0 -.4) scale(1 .95)"/><path d="M16.5 14.8L7.5 22"/><circle cx="8" cy="16.2" r="1.6"/><circle cx="16" cy="20.6" r="1.6"/>`),
  "calculator-h": SV(`<rect x="4" y="2.5" width="16" height="19" rx="2.5"/><rect x="7" y="5.5" width="10" height="3.5" rx=".8"/><g fill="currentColor" stroke="none"><circle cx="8.5" cy="13" r="1.1"/><circle cx="12" cy="13" r="1.1"/><circle cx="15.5" cy="13" r="1.1"/><circle cx="8.5" cy="17" r="1.1"/><circle cx="12" cy="17" r="1.1"/><circle cx="15.5" cy="17" r="1.1"/></g>`),
  "yt-timestamp": SV(`<rect x="2" y="4" width="17" height="13" rx="4"/><path d="M9 8.3v4.9l4.2-2.45z"/><circle cx="18" cy="17" r="4.6" ${CUT}/><path d="M18 14.6V17l1.7 1"/>`),
  "yt-thumbnail": SV(`<rect x="2" y="4" width="20" height="16" rx="5"/><rect x="6.5" y="8" width="8.5" height="6.5" rx="1.2"/><path d="M7 13.6l2.4-2.4 1.6 1.5 1.2-1 2.3 1.9"/><circle cx="9" cy="10" r=".75" fill="currentColor" stroke="none"/><path d="M16.6 14.2v4l3.2-2z" fill="currentColor" stroke-width="1"/>`),
  "yt-embed": SV(`<rect x="2" y="4.5" width="20" height="15" rx="5"/><path d="M10 9.3L7.3 12l2.7 2.7M14 9.3l2.7 2.7-2.7 2.7M12.9 8.8l-1.8 6.4"/>`),
  "currency": SV(`<path d="M9.2 5.2C9.2 4.2 8.3 3.6 7 3.6S4.8 4.2 4.8 5.2 5.7 6.6 7 7s2.2.6 2.2 1.7S8.3 10.4 7 10.4 4.8 9.8 4.8 8.8M7 2.2v1.4M7 10.4v1.4"/><path d="M13 7h7M17.6 4.4L20.2 7l-2.6 2.6"/><path d="M11 17H4M6.4 14.4L3.8 17l2.6 2.6"/><path d="M14 13h6M14 15.6h6M14.4 13h2.3a2.4 2.4 0 0 1 0 4.8h-2.3l4.8 3.4"/>`),
  "astro": SV(`<circle cx="12" cy="12" r="10.5"/><circle cx="12" cy="12" r="5.6"/>${zodiacDots()}<path d="M12 9.6l.7 1.7 1.7.7-1.7.7-.7 1.7-.7-1.7-1.7-.7 1.7-.7z" fill="currentColor" stroke="none"/>`),
  "tally": SV(`<path d="M5 5v14M9.5 5v14M14 5v14M18.5 5v14"/><path d="M2.5 16.5L21.5 7.5"/>`),
  "debt": SV(`<rect x="2" y="6" width="20" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.8"/><path d="M5.5 12h.01M18.5 12h.01" stroke-width="2.4"/>`)
};
function iconTileInner(app){
  return ICONS[app.id] || SV(`<circle cx="12" cy="12" r="9"/>`);
}

function appTile(app){
  return `
    <div class="app">
      <a href="${app.url}" target="_blank">
        <div class="icon-tile" style="background:transparent">${iconTileInner(app)}</div>
        <div class="app-label">${app.name}</div>
      </a>
    </div>`;
}

function archiveRow(app){
  return `
    <div class="archive-row" data-id="${app.id}">
      <div class="icon-tile-sm" style="background:transparent">${iconTileInner(app)}</div>
      <div class="archive-row-name">${app.name}</div>
      <div class="archive-dots" data-dots data-id="${app.id}" aria-label="Options">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      </div>
    </div>`;
}

/* Cap grid height to 4 rows; extra rows scroll (desktop + mobile) */
function applyRowScroll(grid, maxRows){
  maxRows = maxRows || 4;
  grid.style.maxHeight = "";
  grid.style.overflowY = "hidden";

  const items = Array.from(grid.children).filter(el => el.classList.contains("app"));
  if(items.length === 0) return;

  const firstTop = items[0].offsetTop;
  let perRow = 0;
  for(const it of items){
    if(Math.round(it.offsetTop) === Math.round(firstTop)) perRow++;
    else break;
  }
  if(perRow === 0 || items.length <= perRow * maxRows) return;

  const cutoffItem = items[perRow * maxRows];
  const rowGap = parseFloat(getComputedStyle(grid).rowGap) || 0;
  const maxHeight = cutoffItem.offsetTop - rowGap / 2;

  grid.style.maxHeight = maxHeight + "px";
  grid.style.overflowY = "auto";
}

function updateGridMinHeight(){
  const grid = document.getElementById("mainGrid");
  const visible = APPS.filter(a => !archived.includes(a.id));
  grid.style.minHeight = "";
  grid.innerHTML = visible.length
    ? visible.map(a => appTile(a)).join("")
    : `<div class="empty-msg">No apps found</div>`;
  grid.style.minHeight = grid.scrollHeight + "px";
  applyRowScroll(grid, 4);
}

function renderMain(){
  const query = document.getElementById("search").value.trim();
  const firstChar = query.charAt(0).toLowerCase();
  const visible = APPS.filter(a => !archived.includes(a.id));
  const filtered = query
    ? visible.filter(a => a.name.charAt(0).toLowerCase() === firstChar)
    : visible;

  const grid = document.getElementById("mainGrid");
  grid.innerHTML = filtered.length
    ? filtered.map(a => appTile(a)).join("")
    : `<div class="empty-msg">No apps found</div>`;
}

let resizeTimer;
window.addEventListener("resize", ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    updateGridMinHeight();
    renderMain();
    closeArchivePopover();
  }, 150);
});

/* ===== Archive popover (Open / Remove) — fixed position, sideways of the row ===== */
const archivePopover = document.getElementById("archivePopover");
let activePopoverId = null;
let activePopoverRow = null;

function closeArchivePopover(){
  archivePopover.classList.remove("open");
  if(activePopoverRow) activePopoverRow.classList.remove("show-dots");
  activePopoverId = null;
  activePopoverRow = null;
}

function openArchivePopover(dotsEl, row, id){
  activePopoverId = id;
  activePopoverRow = row;
  row.classList.add("show-dots");
  archivePopover.classList.add("open");

  const dotsRect = dotsEl.getBoundingClientRect();
  const popRect = archivePopover.getBoundingClientRect();
  const gap = 8;
  const vpW = window.innerWidth;
  const vpH = window.innerHeight;

  /* Prefer placing it to the right of the row (sideways, never on top of the app) */
  let left = dotsRect.right + gap;
  if(left + popRect.width > vpW - 8){
    left = dotsRect.left - popRect.width - gap;
  }
  left = Math.max(8, Math.min(left, vpW - popRect.width - 8));

  let top = dotsRect.top - 4;
  if(top + popRect.height > vpH - 8){
    top = vpH - popRect.height - 8;
  }
  top = Math.max(8, top);

  archivePopover.style.left = left + "px";
  archivePopover.style.top = top + "px";
}

archivePopover.querySelectorAll("button").forEach(btn=>{
  btn.addEventListener("click", (e)=>{
    e.preventDefault();
    e.stopPropagation();
    const action = btn.getAttribute("data-action");
    const id = activePopoverId;
    const app = APPS.find(a => a.id === id);

    if(action === "open" && app){
      window.open(app.url, "_blank", "noopener");
      closeArchivePopover();
    } else if(action === "remove" && id){
      archived = archived.filter(x => x !== id);
      saveArchived();
      closeArchivePopover();
      renderArchive();
      updateGridMinHeight();
      renderMain();
    }
  });
});

function renderArchive(){
  const list = document.getElementById("archiveList");
  const items = APPS.filter(a => archived.includes(a.id));
  closeArchivePopover();
  list.innerHTML = items.length
    ? items.map(a => archiveRow(a)).join("")
    : `<div class="empty-archive">No archived apps</div>`;

  list.querySelectorAll("[data-dots]").forEach(dots=>{
    dots.addEventListener("click", (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const row = dots.closest(".archive-row");
      const id = dots.getAttribute("data-id");
      if(activePopoverId === id && archivePopover.classList.contains("open")){
        closeArchivePopover();
      } else {
        openArchivePopover(dots, row, id);
      }
    });
  });
}

document.addEventListener("click", (e)=>{
  if(e.target.closest(".archive-popover") || e.target.closest("[data-dots]")) return;
  closeArchivePopover();
});
window.addEventListener("scroll", closeArchivePopover, true);

/* Sidebar */
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const sidebarMenuView = document.getElementById("sidebarMenuView");
const sidebarArchiveView = document.getElementById("sidebarArchiveView");

function showSidebarView(view){
  if(view === "archive"){
    sidebarMenuView.style.display = "none";
    sidebarArchiveView.style.display = "flex";
    renderArchive();
  } else {
    sidebarArchiveView.style.display = "none";
    sidebarMenuView.style.display = "flex";
    closeArchivePopover();
  }
}

document.getElementById("hamburgerBtn").addEventListener("click", ()=>{
  showSidebarView("menu");
  sidebar.classList.add("open");
  overlay.classList.add("open");
});
overlay.addEventListener("click", ()=>{
  sidebar.classList.remove("open");
  overlay.classList.remove("open");
  closeArchivePopover();
});

/* Archive now opens *within* the left sidebar — no right-hand screen */
document.getElementById("archiveNavBtn").addEventListener("click", ()=>{
  showSidebarView("archive");
});
document.getElementById("archiveBackBtn").addEventListener("click", ()=>{
  showSidebarView("menu");
});

/* Picker modal */
const modalOverlay = document.getElementById("modalOverlay");
let selectedForArchive = [];

document.getElementById("archiveAddBtn").addEventListener("click", ()=>{
  selectedForArchive = [];
  const available = APPS.filter(a => !archived.includes(a.id));
  const list = document.getElementById("pickerList");
  list.innerHTML = available.length
    ? available.map(a => `
        <div class="picker-row" data-id="${a.id}">
          <div class="picker-icon" style="background:transparent">${iconTileInner(a)}</div>
          <div class="picker-name">${a.name}</div>
          <div class="picker-check"></div>
        </div>`).join("")
    : `<div class="empty-msg">All apps are already archived</div>`;

  list.querySelectorAll(".picker-row").forEach(row=>{
    row.addEventListener("click", ()=>{
      const id = row.getAttribute("data-id");
      row.classList.toggle("selected");
      if(selectedForArchive.includes(id)){
        selectedForArchive = selectedForArchive.filter(x => x !== id);
      } else {
        selectedForArchive.push(id);
      }
    });
  });

  modalOverlay.classList.add("open");
});

document.getElementById("modalDoneBtn").addEventListener("click", ()=>{
  if(selectedForArchive.length){
    archived = [...new Set([...archived, ...selectedForArchive])];
    saveArchived();
    renderArchive();
    updateGridMinHeight();
    renderMain();
  }
  modalOverlay.classList.remove("open");
});

modalOverlay.addEventListener("click", (e)=>{
  if(e.target === modalOverlay) modalOverlay.classList.remove("open");
});

/* Brand link: behaves like a reload (same tab), never opens a new tab */
document.getElementById("brandLink").addEventListener("click", (e)=>{
  e.preventDefault();
  window.location.reload();
});

updateGridMinHeight();
renderMain();
</script>

</body>
